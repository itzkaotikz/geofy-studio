<!doctype html><html><head><meta charset="utf-8"><title>Geofy Look v3</title><style>
@font-face{font-family:"ID";src:url(../fonts/InterDisplay-Medium.otf);font-weight:500}
@font-face{font-family:"ID";src:url(../fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:"ID";src:url(../fonts/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:"ID";src:url(../fonts/InterDisplay-Black.otf);font-weight:900}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../vendor/d3.min.js"></script>
<script>
const Q=new URLSearchParams(location.search), STYLE=Q.get('s')||'A';
const W=1080,H=1920, ctx=document.getElementById('c').getContext('2d');
const BOS=[[29.13,41.23],[29.08,41.17],[29.06,41.11],[29.04,41.07],[29.01,41.03],[28.99,41.0]];

const T={
 A:{bg0:'#06142A',bg1:'#01040A',sea:null,land:'#13263E',landHi:'rgba(63,224,255,0.14)',border:'rgba(120,200,255,0.35)',hiBorder:'#3FE0FF',acc:'#3FE0FF',warn:'#FF4D6D',ink:'#F4F8FF',sub:'#9FB3C8',grid:'rgba(120,200,255,0.07)',glow:true},
 B:{bg0:'#0B0B0C',bg1:'#030303',land:'#2A2E35',landHi:'#FFB020',border:null,hiBorder:null,acc:'#FFB020',warn:'#FF3B30',ink:'#FFFFFF',sub:'#8A8F98',grid:'rgba(255,255,255,0.05)',dots:true},
 C:{bg0:'#EAF0F2',bg1:'#DCE6EA',land:'#FBFAF6',landHi:'rgba(255,90,54,0.20)',border:'#1B1F24',hiBorder:'#FF5A36',acc:'#FF5A36',warn:'#E5243B',ink:'#111418',sub:'#5B6470',grid:'rgba(17,20,24,0.06)',light:true},
}[STYLE];
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);};
(async()=>{
 await document.fonts.load('900 80px ID'); await document.fonts.load('700 80px ID'); await document.fonts.load('600 40px ID'); await document.fonts.load('500 40px ID'); await document.fonts.load('600 30px JM');
 const w=await (await fetch('../data/world.json')).json(); const g=await (await fetch('../jobs/was-waere-wenn-05-bosporus/geo.json')).json();
 const feats=w.features.map(f=>({type:'Feature',id:f.id,geometry:g[f.id]||f.geometry}));
 const proj=d3.geoMercator().center([29.9,41.9]).scale(1080/(10.5*Math.PI/180)).translate([W/2,960]);
 const path=d3.geoPath(proj,ctx); const P=p=>proj(p);
 // background
 const gr=ctx.createRadialGradient(W/2,900,100,W/2,900,1400); gr.addColorStop(0,T.bg0); gr.addColorStop(1,T.bg1); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
 // grid
 ctx.strokeStyle=T.grid; ctx.lineWidth=1.5; ctx.beginPath(); path(d3.geoGraticule().step([1,1])()); ctx.stroke();
 const hi=new Set(['TUR']);
 if(T.dots){ // dot matrix land
  const off=new OffscreenCanvas(W,H), o=off.getContext('2d'); const p2=d3.geoPath(proj,o);
  feats.forEach(f=>{o.beginPath(); p2(f); o.fillStyle=hi.has(f.id)?'#f00':'#0f0'; o.fill();});
  const img=o.getImageData(0,0,W,H).data; const s=13;
  for(let y=s/2;y<H;y+=s) for(let x=s/2;x<W;x+=s){const i=((y|0)*W+(x|0))*4; if(img[i+3]<10) continue; const isHi=img[i]>200; ctx.fillStyle=isHi?T.landHi:T.land; ctx.beginPath(); ctx.arc(x,y,isHi?4.4:3.6,0,7); ctx.fill();}
 } else {
  feats.forEach(f=>{ctx.beginPath(); path(f); ctx.fillStyle=T.land; ctx.fill();});
  feats.forEach(f=>{if(!hi.has(f.id)) return; ctx.beginPath(); path(f); ctx.fillStyle=T.landHi; ctx.fill();});
  ctx.lineJoin='round';
  feats.forEach(f=>{ctx.beginPath(); path(f); ctx.strokeStyle=hi.has(f.id)?T.hiBorder:T.border; ctx.lineWidth=hi.has(f.id)?3:1.6; if(T.glow&&hi.has(f.id)){ctx.shadowColor=T.acc; ctx.shadowBlur=18;} ctx.stroke(); ctx.shadowBlur=0;});
 }
 if(T.light){ // subtle drop shadow under land for depth
 }
 // route + ships
 const line=(pts,col,wd,dash=[],glow=0)=>{ctx.save(); ctx.beginPath(); pts.map(P).forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.setLineDash(dash); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=col; ctx.lineWidth=wd; if(glow){ctx.shadowColor=col; ctx.shadowBlur=glow;} ctx.stroke(); ctx.restore();};
 line(ROUTE,T.light?'rgba(17,20,24,0.35)':'rgba(255,255,255,0.28)',3,[10,12]);
 line(BOS,T.acc,9,[],T.glow?24:0);
 const ship=(p,ang,col)=>{const [x,y]=P(p); ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(5,-6); ctx.lineTo(-13,-6); ctx.lineTo(-13,6); ctx.lineTo(5,6); ctx.closePath(); ctx.fillStyle=col; if(T.glow){ctx.shadowColor=col; ctx.shadowBlur=10;} ctx.fill(); ctx.restore();};
 [[29.45,41.5],[29.75,41.55],[29.62,41.68],[29.95,41.66],[29.4,41.75],[30.1,41.8],[29.85,41.85]].forEach((p,i)=>ship(p,2.5,T.light?['#111418','#3B4450'][i%2]:['#FFFFFF',T.acc][i%2]));
 // barrier
 const [bx,by]=P([29.05,41.10]); ctx.save(); ctx.translate(bx,by); ctx.rotate(-0.12); ctx.lineCap='round';
 if(T.glow){ctx.shadowColor=T.warn; ctx.shadowBlur=30;} ctx.strokeStyle=T.warn; ctx.lineWidth=14; ctx.beginPath(); ctx.moveTo(-72,0); ctx.lineTo(72,0); ctx.stroke(); ctx.restore();
 // crosshair label
 const tagHud=(x,y,txt)=>{ctx.save(); ctx.strokeStyle=T.acc; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x+18,y-18); ctx.lineTo(x+120,y-120); ctx.lineTo(x+330,y-120); ctx.stroke(); ctx.fillStyle=T.acc; ctx.font='600 26px JM'; ctx.fillText(txt,x+126,y-134); ctx.restore();};
 if(STYLE==='B'){ // HUD brackets around Bosporus
  ctx.strokeStyle=T.acc; ctx.lineWidth=3; const s=70; [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{ctx.beginPath(); ctx.moveTo(bx+a*s,by+b*(s-26)); ctx.lineTo(bx+a*s,by+b*s); ctx.lineTo(bx+a*(s-26),by+b*s); ctx.stroke();});
  tagHud(bx+40,by-40,'41.10°N  29.05°E');
 } else tagHud(bx+30,by-30,'BOSPORUS · 0,7 KM');
 // vignette top/bottom for legibility
 const vg=ctx.createLinearGradient(0,0,0,H); const vc=T.light?'242,239,232':'2,6,12';
 vg.addColorStop(0,`rgba(${vc},0.92)`); vg.addColorStop(0.24,`rgba(${vc},0)`); vg.addColorStop(0.74,`rgba(${vc},0)`); vg.addColorStop(1,`rgba(${vc},0.95)`); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
 // header
 const L=72;
 ctx.textBaseline='alphabetic'; ctx.fillStyle=T.ink; ctx.font='800 34px ID'; ctx.font='900 34px ID'; ctx.fillText('geofy',L,236); ctx.fillStyle=T.acc; ctx.fillText('.',L+ctx.measureText('geofy').width,236);
 ctx.font='600 26px JM'; ctx.fillStyle=T.acc; const kick='WAS WÄRE WENN · #05'; ctx.fillText(kick,L,300);
 ctx.fillStyle=T.ink; ctx.font='900 74px ID'; ctx.fillText('Der Bosporus',L,384); ctx.fillText('wird gesperrt.',L,466);
 // timeline badge
 ctx.font='700 30px JM'; const bt='TAG 01'; const bw=ctx.measureText(bt).width+48; const bxx=W-L-bw;
 if(STYLE==='A'){rr(bxx,198,bw,56,14); ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle=T.acc; ctx.beginPath(); ctx.arc(bxx+22,226,6,0,7); ctx.fill(); ctx.fillStyle=T.ink; ctx.fillText(bt,bxx+38,237);}
 else if(STYLE==='B'){ctx.strokeStyle=T.acc; ctx.lineWidth=2.5; ctx.strokeRect(bxx,198,bw,56); ctx.fillStyle=T.acc; ctx.fillText(bt,bxx+24,237);}
 else {rr(bxx,198,bw,56,28); ctx.fillStyle=T.ink; ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(bt,bxx+24,237);}
 // stat panel
 const px=L, py=560, pw=460, ph=230;
 if(STYLE==='A'){rr(px,py,pw,ph,32); ctx.fillStyle='rgba(10,24,42,0.55)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=2; ctx.stroke(); const lg=ctx.createLinearGradient(px,py,px+pw,py); lg.addColorStop(0,T.acc); lg.addColorStop(1,'rgba(63,224,255,0)'); ctx.fillStyle=lg; ctx.fillRect(px+32,py+ph-34,pw-64,4);}
 else if(STYLE==='B'){ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(px,py,pw,ph); ctx.strokeStyle='rgba(255,176,32,0.6)'; ctx.lineWidth=2; ctx.strokeRect(px,py,pw,ph);}
 else {rr(px,py,pw,ph,24); ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.12)'; ctx.shadowBlur=30; ctx.shadowOffsetY=10; ctx.fill(); ctx.shadowBlur=0; ctx.shadowOffsetY=0;}
 ctx.font='600 24px JM'; ctx.fillStyle=T.sub; ctx.fillText('ENGSTE STELLE',px+36,py+60);
 ctx.font='900 120px ID'; ctx.fillStyle=STYLE==='C'?T.ink:T.ink; ctx.fillText('700',px+32,py+176); const nw=ctx.measureText('700').width; ctx.font='700 56px ID'; ctx.fillStyle=T.acc; ctx.fillText('m',px+44+nw,py+176);
 // warning chip
 const cy=1300; ctx.font='800 34px ID'; ctx.font='700 32px JM'; const ct='● GESPERRT'; const cw=ctx.measureText(ct).width+52;
 if(STYLE==='C'){rr(L,cy,cw,66,33); ctx.fillStyle=T.warn; ctx.fill(); ctx.fillStyle='#fff';}
 else if(STYLE==='B'){ctx.fillStyle=T.warn; ctx.fillRect(L,cy,cw,66); ctx.fillStyle='#000';}
 else {rr(L,cy,cw,66,18); ctx.fillStyle='rgba(255,77,109,0.16)'; ctx.fill(); ctx.strokeStyle=T.warn; ctx.lineWidth=2.5; ctx.stroke(); ctx.fillStyle=T.warn;}
 ctx.fillText(ct,L+26,cy+44);
 // subtitles: 3 words, active word highlighted
 const words=['wird','heute','Nacht','gesperrt.'], act=3; const sy=1560;
 ctx.font=STYLE==='B'?'900 70px ID':'800 70px ID'; ctx.font=(STYLE==='B'?'900':'700')+' 70px ID';
 const disp=words.map(w=>STYLE==='B'?w.toUpperCase():w); const sp=20; let ws=disp.map(w=>ctx.measureText(w).width); let tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1); if(tot>W-2*L-40){const k=(W-2*L-40)/tot; ctx.font=(STYLE==='B'?'900':'700')+' '+Math.floor(70*k)+'px ID'; ws=disp.map(w=>ctx.measureText(w).width); tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);} let x=(W-tot)/2;
 if(STYLE==='C'){rr(x-34,sy-74,tot+68,104,26); ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.14)'; ctx.shadowBlur=30; ctx.fill(); ctx.shadowBlur=0;}
 disp.forEach((w,i)=>{ if(i===act){ if(STYLE==='C'){ctx.fillStyle=T.acc; ctx.fillRect(x,sy+10,ws[i],8); ctx.fillStyle=T.ink;} else {rr(x-12,sy-64,ws[i]+24,86,STYLE==='B'?4:16); ctx.fillStyle=T.acc; ctx.fill(); ctx.fillStyle=STYLE==='A'?'#03121F':'#000';} }
  else ctx.fillStyle=STYLE==='C'?T.ink:(i<act?T.ink:'rgba(255,255,255,0.55)');
  if(STYLE!=='C'&&i!==act){ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=16;} ctx.fillText(w,x,sy); ctx.shadowBlur=0; x+=ws[i]+sp;});
 // footer source / progress
 ctx.fillStyle=STYLE==='C'?'rgba(17,20,24,0.15)':'rgba(255,255,255,0.15)'; ctx.fillRect(L,1690,W-2*L,4); ctx.fillStyle=T.acc; ctx.fillRect(L,1690,(W-2*L)*0.12,4);
 window.done=true;
})();
