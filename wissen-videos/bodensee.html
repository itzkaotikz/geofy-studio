body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Der Bodensee hat keine Grenze. Mitten im See treffen Deutschland, Österreich und die Schweiz aufeinander, doch wem welcher Teil gehört, haben die drei Länder nie festgelegt.

Der See ist 536 Quadratkilometer groß und bis zu 251 Meter tief. Am Ufer ist alles klar: Deutschland hat 173 Kilometer, die Schweiz 72 und Österreich 28. Nur im offenen Wasser gibt es keine Linie.

Warum? Jahrhundertelang ging es auch ohne. Man fischte und fuhr Schiff, und geregelt wurde nur, was wirklich Ärger machte. Eine Grenze brauchte niemand.

Dazu gibt es drei Meinungen. Österreich sagt: Der offene See gehört allen gemeinsam. Die Schweiz wollte ihn lange in Stücke teilen. Und Deutschland sagt: Die Frage ist bis heute offen.

Nur im Untersee und bei Konstanz verläuft die Grenze in der Mitte. Im offenen See gilt: Fische gehören niemandem, bis sie gefangen sind. Und bei einem Notruf hilft das Land, bei dem er ankommt.

Eine Grenze, die es nicht gibt, und trotzdem funktioniert alles.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>

 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
