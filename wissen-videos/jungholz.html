<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage Grotesque";src:url(/geofy-studio/fonts/BricolageGrotesque.ttf);font-weight:200 800}
@font-face{font-family:"Hanken Grotesk";src:url(/geofy-studio/fonts/HankenGrotesk.ttf);font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url(/geofy-studio/fonts/JetBrainsMono.ttf);font-weight:100 800}
body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Dieses Dorf gehört zu Österreich. Aber mit dem Rest des Landes ist es nur an einem einzigen Punkt verbunden, auf einem Berggipfel.

Das ist Jungholz in Tirol. Rund 300 Menschen leben hier, auf gut sieben Quadratkilometern. Fast rundherum liegt Bayern.

Die einzige Verbindung zu Österreich ist der Gipfel des Sorgschrofen, 1.636 Meter hoch. Wer mit dem Auto in den Rest Tirols will, muss durch Deutschland fahren.

Wie kam es dazu? 1342 wurde das Gebiet verkauft, und es kam von Bayern zu Tirol. Die Grenzen drumherum wurden erst viel später festgelegt, 1844 und 1850.

Wirtschaftlich hängt Jungholz an Deutschland. Seit 1868 gehört es zum deutschen Zollgebiet, und bis zum Euro zahlte man hier mit D-Mark. Das Dorf hat sogar zwei Postleitzahlen, eine österreichische und eine deutsche.

Ein österreichisches Dorf, das man nur über Deutschland erreicht. Und trotzdem ist es ganz normal ein Teil Tirols.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>
<script src="/geofy-studio/vendor/d3.min.js"></script><script src="kv-engine.js"></script><script src="jungholz.js"></script>
<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.DACH=await (await fetch('dach_10m.json')).json();  
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['einzigen','300','Sorgschrofen','1342','1868','zwei Postleitzahlen'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
</script></body></html>
