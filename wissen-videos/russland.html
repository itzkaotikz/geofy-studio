@font-face{font-family:"Bricolage Grotesque";src:url(/geofy-studio/fonts/BricolageGrotesque.ttf);font-weight:200 800}
@font-face{font-family:"Hanken Grotesk";src:url(/geofy-studio/fonts/HankenGrotesk.ttf);font-weight:100 900}

body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Auf der Weltkarte wirkt Russland fast so groß wie Afrika. In Wirklichkeit ist Afrika fast doppelt so groß.

Schuld ist wieder die Mercator-Karte. Sie wurde für Seefahrer gemacht, nicht für Größenvergleiche. Je weiter ein Land im Norden liegt, desto stärker wird es aufgeblasen. Und Russland liegt fast komplett hoch im Norden.

Bei 60 Grad Nord erscheint jede Fläche auf der Karte viermal so groß, wie sie wirklich ist. Genau dort liegen große Teile von Sibirien.

Schieben wir Russland an den Äquator, in echter Größe. Plötzlich wirkt es viel kleiner, ungefähr so groß wie Südamerika, und Afrika ist klar der Riese.

Trotzdem bleibt Russland das größte Land der Erde, mit gut 17 Millionen Quadratkilometern. Das zweitgrößte Land, Kanada, hat knapp 10 Millionen. Und Russland reicht über elf Zeitzonen, von Kaliningrad bis zur Beringstraße.

Die Karte lügt also nicht über die Rangliste, nur über die Größenverhältnisse.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>
<script src="/geofy-studio/vendor/d3.min.js"></script><script src="kv-engine.js"></script><script src="russland.js"></script>
<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.WW=w; window.AUSG=await (await fetch('aus_10m.json')).json();  
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['In Wirklichkeit','Je weiter','viermal','Schieben','17','elf Zeitzonen','Rangliste'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
</script></body></html>
