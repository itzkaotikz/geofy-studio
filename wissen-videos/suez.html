body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Im März 2021 blieb ein einziges Schiff stecken, und fast 450 andere mussten warten. Der Ort: der Suezkanal, eines der wichtigsten Nadelöhre der Welt.

Der Kanal ist 193 Kilometer lang und verbindet das Mittelmeer mit dem Roten Meer. Er hat keine einzige Schleuse, weil beide Meere fast gleich hoch liegen. Eröffnet wurde er 1869.

Warum ist er so wichtig? Ohne den Kanal müssten Schiffe von Asien nach Europa ganz um Afrika herumfahren. Von Singapur nach Rotterdam sind das rund 6.000 Kilometer mehr, also etwa neun Tage länger.

Normalerweise fahren hier rund acht Prozent des weltweiten Seehandels durch. Öl, Kleidung, Elektronik, vieles davon landet am Ende auch bei uns.

Genau deshalb war die Ever Given so ein Problem. Das 400 Meter lange Containerschiff stand sechs Tage quer im Kanal. Weltweit kamen Lieferungen zu spät.

Und seit Ende 2023 meiden viele Reedereien das Rote Meer wegen Angriffen auf Schiffe. Sie nehmen wieder den langen Weg um Afrika. Erst langsam kehren sie zurück.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>
<script src="/geofy-studio/vendor/d3.min.js"></script><script src="kv-engine.js"></script><script src="suez.js"></script>
<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); 
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['stecken','450','Suezkanal','193','Schleuse','Eröffnet','herumfahren','6.000','neun Tage','acht Prozent','bei uns','400','sechs Tage','zu spät','Angriffen','langen Weg','langsam'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
