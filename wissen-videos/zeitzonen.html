<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage Grotesque";src:url(/geofy-studio/fonts/BricolageGrotesque.ttf);font-weight:200 800}
@font-face{font-family:"Hanken Grotesk";src:url(/geofy-studio/fonts/HankenGrotesk.ttf);font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url(/geofy-studio/fonts/JetBrainsMono.ttf);font-weight:100 800}
body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Welches Land hat die meisten Zeitzonen? Russland ist riesig, die USA auch. Aber die richtige Antwort ist Frankreich. Mit ganzen zwölf Zeitzonen.

Wie geht das? Zu Frankreich gehört nicht nur das Land in Europa. Dazu kommen Überseegebiete, verteilt über die ganze Welt. Sie sind Überbleibsel aus der Kolonialzeit und gehören bis heute zu Frankreich.

In der Karibik liegen Guadeloupe und Martinique. In Südamerika Französisch-Guayana. Im Indischen Ozean La Réunion und Mayotte. Und im Pazifik Neukaledonien und Französisch-Polynesien.

Das hat verrückte Folgen. Wenn es im Sommer in Paris zwölf Uhr mittags ist, ist es auf Tahiti gerade Mitternacht. Und auf Wallis und Futuna schon zehn Uhr abends.

Russland und die USA kommen jeweils auf elf Zeitzonen. Bei den USA zählen allerdings auch kleine Inseln im Pazifik mit.

Und China? Das Land ist ungefähr so breit wie die USA, nutzt aber nur eine einzige Zeitzone. Im Westen geht die Sonne im Winter deshalb erst gegen zehn Uhr auf.

Hättest du auf Frankreich getippt? Schreib es in die Kommentare und folge für mehr Rekorde.
</script><canvas id="c" width="1080" height="1920"></canvas>
<script src="/geofy-studio/vendor/d3.min.js"></script><script src="kv-engine.js"></script><script src="zeitzonen.js"></script>
<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w);
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['Frankreich','zwölf Zeitzonen','Überseegebiete','Karibik','Südamerika','Indischen','Pazifik','Paris','Tahiti','Wallis','elf','Inseln','einzige','Im Westen'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
</script></body></html>
