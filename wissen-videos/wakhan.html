body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Schau dir die Karte von Afghanistan an. Ganz im Nordosten ragt ein dünner Finger weit nach Osten, bis nach China. Warum gibt es diesen Streifen?

Das ist der Wakhan-Korridor. Er ist rund 350 Kilometer lang, aber an manchen Stellen nur 13 Kilometer breit. Im Norden ragt der Pamir auf, im Süden der Hindukusch.

Im 19. Jahrhundert kämpften zwei Weltreiche um Zentralasien: Russland von Norden, die Briten von Süden aus Indien. Dieses Ringen nannte man das Große Spiel.

Damit sich beide Reiche nirgends direkt berühren, legten sie 1895 die Grenzen fest. Der schmale Streifen dazwischen ging an Afghanistan, als Puffer.

Heute grenzt der Korridor im Norden an Tadschikistan, im Süden an Pakistan und ganz im Osten auf 92 Kilometern an China. Der Wachdschir-Pass an der Grenze liegt auf über 4.900 Metern.

Im ganzen Bezirk leben nur rund 18.000 Menschen. Ein Grenzstreifen, gezogen von zwei Weltreichen, die es so längst nicht mehr gibt.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>

window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.G10=await (await fetch('wakhan_10m.json')).json();  
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['Finger','350','13 Kilometer','Große Spiel','1895','92','4.900','18.000'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();

window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
