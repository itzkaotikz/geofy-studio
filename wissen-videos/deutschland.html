<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage Grotesque";src:url(/geofy-studio/fonts/BricolageGrotesque.ttf);font-weight:200 800}
@font-face{font-family:"Hanken Grotesk";src:url(/geofy-studio/fonts/HankenGrotesk.ttf);font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url(/geofy-studio/fonts/JetBrainsMono.ttf);font-weight:100 800}
body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Wie groß ist Deutschland eigentlich? Auf den meisten Weltkarten wirkt es ziemlich ordentlich. Aber diese Karten täuschen.

Erinnerst du dich an Grönland und Afrika? Die Mercator-Karte vergrößert alles, was weit vom Äquator entfernt liegt. Und Deutschland liegt ziemlich weit im Norden. Schieben wir es zum Äquator, schrumpft es auf weniger als die Hälfte.

Jetzt der Vergleich. Allein Texas ist fast doppelt so groß wie Deutschland. In die gesamten USA passt Deutschland rund 27-mal. Und in Russland sogar fast 48-mal.

Und Afrika? Da passt Deutschland rund 85-mal hinein. Allein die Demokratische Republik Kongo ist mehr als sechsmal so groß.

Welches Land ist ungefähr gleich groß? Japan. Auf der Karte wirkt es schmal und klein, ist aber sogar ein bisschen größer als Deutschland.

Bei der Fläche schafft es Deutschland nicht einmal unter die 60 größten Länder der Welt. Bei den Einwohnern liegt es aber unter den Top 20.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>
<script src="/geofy-studio/vendor/d3.min.js"></script><script src="kv-engine.js"></script><script src="deutschland.js"></script>
<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.SHAPE_TEX=await (await fetch('texas.json')).json();
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['täuschen','Grönland','Norden','Hälfte','Texas','27-mal','48-mal','85-mal','Demokratische','sechsmal','Japan','ein bisschen','Fläche','Top 20'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
</script></body></html>
