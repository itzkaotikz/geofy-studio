body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Auf der Weltkarte wirkt der Kongo kleiner als Westeuropa. In Wirklichkeit passen Deutschland, Frankreich, Spanien, Italien und Großbritannien zusammen hinein, und es bleibt noch Platz.

Die Demokratische Republik Kongo ist mit rund 2,3 Millionen Quadratkilometern das zweitgrößte Land Afrikas. Deutschland passt etwa sechseinhalbmal hinein.

Warum wirkt sie trotzdem so klein? Der Kongo liegt direkt am Äquator. Dort zeigt die Mercator-Karte Flächen fast in echter Größe. Je weiter man nach Norden oder Süden geht, desto stärker bläht sie alles auf.

Europa dagegen liegt weit im Norden. Deutschland erscheint auf der Karte etwa zweieinhalbmal so groß, wie es wirklich ist. Großbritannien sogar fast dreimal.

Schieben wir die fünf Länder in echter Größe in den Kongo. Von der Fläche her passen alle hinein, und dann ist noch Platz für ein weiteres Deutschland.

Dazu kommt der zweitgrößte tropische Regenwald der Erde, gleich nach dem Amazonas. Auf der Karte unscheinbar, in Wirklichkeit ein Riese.

Wusstest du das schon? Gib dem Video ein Like, folg uns für mehr, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>

 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}

 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
