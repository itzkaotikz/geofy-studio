body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Auf der Weltkarte ist die Antarktis ein endloser weißer Streifen am unteren Rand. Wie groß ist sie wirklich?

Das liegt an der Mercator-Karte. Je näher ein Ort am Pol liegt, desto stärker wird er in die Breite gezogen. Am Pol selbst wäre die Verzerrung unendlich. Deshalb schneiden viele Karten die Antarktis einfach ab.

Auf dem Globus bleiben rund 14 Millionen Quadratkilometer. Das ist fast doppelt so viel wie Australien und mehr als ganz Europa.

Fast alles davon ist Eis. 98 Prozent des Kontinents sind bedeckt, im Schnitt mit mehr als zwei Kilometern. In diesem Eis stecken etwa 70 Prozent des Süßwassers der Erde.

Und niemandem gehört sie. Der Antarktis-Vertrag legt fest, dass der Kontinent nur für Frieden und Forschung genutzt wird.

Die Antarktis ist sogar die größte Wüste der Erde, größer als die Sahara, nur eben aus Eis.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>

 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
