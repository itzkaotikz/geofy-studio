body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">In Samoa gab es den 30. Dezember 2011 nicht. Auf Donnerstag, den 29., folgte direkt Samstag, der 31. Ein ganzer Tag wurde einfach gestrichen.

Samoa liegt mitten im Pazifik, direkt neben der Datumsgrenze. Diese Linie trennt zwei Kalendertage: Westlich davon ist es einen Tag später als östlich.

1892 wechselte Samoa auf die Ostseite der Linie, wegen des Handels mit Amerika und Europa. Über hundert Jahre lang hatte Samoa damit dasselbe Datum wie Amerika.

Doch heute handelt Samoa vor allem mit Australien und Neuseeland. Die lagen 21 und 23 Stunden voraus. Wenn in Samoa Freitag war, war in Neuseeland schon Samstag. Der Premierminister sagte: Wir verlieren zwei Arbeitstage pro Woche.

Also sprang Samoa zurück auf die Westseite. Seitdem hat es fast dieselbe Uhrzeit wie Neuseeland. Das kleine Tokelau machte den Sprung gleich mit.

Und das Kurioseste: Das benachbarte Amerikanisch-Samoa blieb auf der anderen Seite. Dazwischen liegt weniger als eine Flugstunde, aber ein ganzer Tag.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>

window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.AUSG=await (await fetch('aus_10m.json')).json(); window.S10=await (await fetch('samoa_10m.json')).json();  
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['nicht.','gestrichen','Datumsgrenze','1892','Premierminister','sprang','Flugstunde'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});

const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
