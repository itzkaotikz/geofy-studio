body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Vor 70 Jahren stand hier fast nichts. Heute ist es die Hauptstadt eines der größten Länder der Welt. Gebaut in nur 41 Monaten.

Brasília ist seit 1960 die Hauptstadt Brasiliens. Davor war es Rio de Janeiro, direkt am Atlantik. Die neue Hauptstadt liegt rund 900 Kilometer weiter im Landesinneren.

Warum dieser Aufwand? Die meisten Brasilianer lebten damals nah an der Küste. Das riesige Landesinnere war kaum erschlossen. Eine Hauptstadt in der Mitte sollte das ändern.

Die Idee war alt. Schon die Verfassung von 1891 legte fest, dass die Hauptstadt ins Zentrum des Landes ziehen soll. Umgesetzt hat es erst Präsident Juscelino Kubitschek. Sein Ziel: 50 Jahre Fortschritt in fünf.

Geplant wurde die Stadt am Reißbrett, von Lúcio Costa und Oscar Niemeyer. Von oben erinnert ihr Grundriss an ein Flugzeug oder einen Vogel. Seit 1987 ist sie Weltkulturerbe.

Heute leben in Brasília fast drei Millionen Menschen. Aus dem Nichts wurde eine der größten Städte des Landes.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>

<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w);  
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['41','1960','Rio','900','Küste','ändern','1891','Kubitschek','50 Jahre','Reißbrett','Flugzeug','1987','drei Millionen'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
</script></body></html>
