<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage Grotesque";src:url(/geofy-studio/fonts/BricolageGrotesque.ttf);font-weight:200 800}
@font-face{font-family:"Hanken Grotesk";src:url(/geofy-studio/fonts/HankenGrotesk.ttf);font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url(/geofy-studio/fonts/JetBrainsMono.ttf);font-weight:100 800}
body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Hier fahren riesige Schiffe 26 Meter bergauf, über einen See, mitten durch den Dschungel. Willkommen am Panamakanal.

Der Kanal ist rund 80 Kilometer lang und verbindet den Atlantik mit dem Pazifik. Ohne ihn müssten Schiffe ganz um Südamerika herum, um das Kap Hoorn.

Weil das Land in der Mitte höher liegt, arbeitet der Kanal mit Schleusen. Sie heben die Schiffe auf den Gatúnsee, 26 Meter über dem Meer. Auf der anderen Seite geht es wieder hinunter.

Für jede Durchfahrt fließen rund 200 Millionen Liter Süßwasser ins Meer. Als 2023 der Regen ausblieb, durften nur noch 22 Schiffe am Tag durch, statt normalerweise 36.

Gebaut wurde er unter enormen Opfern. Beim französischen Versuch starben schätzungsweise 22.000 Menschen, beim amerikanischen Bau noch einmal rund 5.600. 1914 wurde der Kanal eröffnet.

Seit 1999 gehört er Panama. Und mehr als fünf Prozent des Welthandels fahren heute durch diesen schmalen Kanal.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>
<script src="/geofy-studio/vendor/d3.min.js"></script><script src="kv-engine.js"></script><script src="panama.js"></script>
<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.PANG=await (await fetch('pan_10m.json')).json(); window.GATUN=await (await fetch('gatun.json')).json();  
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['bergauf','Kap Hoorn','Schleusen','200','2023','22.000','1914','fünf Prozent'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
</script></body></html>
