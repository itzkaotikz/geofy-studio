@font-face{font-family:"Bricolage Grotesque";src:url(/geofy-studio/fonts/BricolageGrotesque.ttf);font-weight:200 800}
@font-face{font-family:"Hanken Grotesk";src:url(/geofy-studio/fonts/HankenGrotesk.ttf);font-weight:100 900}

body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Ein ganzer Kontinent, und fast alle wohnen am Rand. Mehr als acht von zehn Australiern leben höchstens 50 Kilometer vom Meer entfernt.

Australien ist fast so groß wie die USA ohne Alaska und Hawaii, hat aber nur rund 27 Millionen Einwohner. Fast 19 Millionen leben in den Hauptstädten.

Der Grund ist das Wasser. Australien ist der trockenste bewohnte Kontinent. 70 Prozent der Fläche sind trocken oder halbtrocken, in der Trockenzone fallen im Schnitt höchstens 250 Millimeter Regen im Jahr.

Dazu kommt die Geschichte. Die Briten gründeten 1788 ihre erste Siedlung bei Sydney, am Meer. Das Landesinnere blieb lange fast leer.

Noch heute lebt die Mehrheit im Südosten und an der Ostküste, wo genug Regen fällt. Sydney und Melbourne haben jeweils mehr als vier Millionen Einwohner.

Auf einer Nachtkarte sieht man das sofort: ein Lichtband am Rand, und im Inneren fast nur Dunkelheit.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>
<script src="/geofy-studio/vendor/d3.min.js"></script><script src="kv-engine.js"></script><script src="australien.js"></script>
<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.AUSG=await (await fetch('aus_10m.json')).json();  
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['50 Kilometer','nur rund','Fast 19','trockenste','70 Prozent','1788','Nachtkarte'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
</script></body></html>
