body{margin:0;background:#000}</style></head><body><script type="text/plain" id="script">Was würde passieren, wenn alles Eis der Erde schmilzt? Der Meeresspiegel würde um rund 70 Meter steigen. Das ist so hoch wie ein Hochhaus mit über 20 Stockwerken. Und die Weltkarte sähe plötzlich ganz anders aus.

Das meiste Eis liegt in der Antarktis. Allein dort würde es für fast 60 Meter reichen. Grönland bringt noch einmal gut sieben Meter dazu.

Schauen wir nach Deutschland. Die Nordsee würde weit ins Land reichen. Hamburg, Bremen und Hannover lägen unter Wasser. Und sogar Berlin läge unter dem Meeresspiegel.

Die Niederlande wären fast vollständig verschwunden, Dänemark zu großen Teilen. Und Venedig läge tief unter dem Meer.

Weltweit träfe es Millionenstädte wie Shanghai, Bangkok und Mumbai. Florida und große Teile von Bangladesch gäbe es nicht mehr.

Keine Sorge: Bis alles Eis geschmolzen ist, würde es Tausende Jahre dauern. Aber der Meeresspiegel steigt schon heute. Seit 1880 sind es über 20 Zentimeter.

Wusstest du das schon? Gib dem Video ein Like, schreib in die Kommentare, ob du es wusstest, und schick es jemandem, den das auch interessiert.</script><canvas id="c" width="1080" height="1920"></canvas>

<script>
window.ready=(async()=>{const w=await (await fetch('/geofy-studio/data/world.json')).json(); KV.setWorld(w); window.WORLDRAW=w; window.FLOOD=[]; for(let i=0;i<15;i++){const im=new Image(); im.src='flood/f'+String(i*5).padStart(2,'0')+'.png'; await new Promise((r,j)=>{im.onload=r; im.onerror=()=>j(new Error('img '+i));}); window.FLOOD.push(im);} 
 const style=new URLSearchParams(location.search).get('style')||'studio'; if(style!=='studio'){const im=new Image(); im.src='tex/'+style+'.jpg'; await im.decode(); KV.setStyle(style,im);}
 await Promise.all(['800 40px "Bricolage Grotesque"','700 30px "Hanken Grotesk"','700 30px "JetBrains Mono"','500 30px "Hanken Grotesk"'].map(f=>document.fonts.load(f)));
 const st=makeStory(); const tf=new URLSearchParams(location.search).get('timing'); const timing=tf?await (await fetch(tf)).json():null; const S=KV.build(st,window.WPM||158,timing); S.tag=st.tag;
 S.scenes.forEach(sc=>{ // pops on visible moments
  ['70 Meter','Hochhaus','Antarktis','Grönland','Nordsee','Hamburg','Bremen','Hannover','sogar Berlin','Niederlande','Dänemark','Venedig','Shanghai','Bangkok','Mumbai','Florida','Bangladesch','Tausende','1880'].forEach(f=>{if(sc.say.includes(f)) S.events.push({t:sc.start+st.wt(sc,f),kind:'pop'});});});
 window.S=S; return {total:S.total,scenes:S.scenes.map(s=>({head:s.head,start:+s.start.toFixed(2),dur:+s.dur.toFixed(2),say:s.say})),events:S.events};})();
const ctx=document.getElementById('c').getContext('2d');
window.frame=(t,q)=>{KV.draw(ctx,t); return document.getElementById('c').toDataURL('image/jpeg',q||0.93);};
